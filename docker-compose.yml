version: "3.9"

services:
  python-server:
    build:
      context: ./python-server
    container_name: sign-language-python
    ports:
      - "8000:8000"
    volumes:
      - ./python-server:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  spring-server:
    build:
      context: ./spring-server
    container_name: sign-language-spring
    ports:
      - "8080:8080"
    depends_on:
      - python-server
    environment:
      - JAVA_OPTS=-Dpython.server.url=http://python-server:8000
    networks:
      - app-network



















networks:
  app-network:
    driver: bridge
