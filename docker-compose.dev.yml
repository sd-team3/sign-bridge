services:
  python-server:
    build:
      context: ./python-server
    container_name: sign-language-python
    ports:
      - "8000:8000"
    volumes:
      - ./python-server:/app
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    networks:
      - app-network
      
  es-dev:
    build:
      context: .
      dockerfile: Dockerfile.es-nori
    image: es-with-nori:8.15.0
    container_name: es-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - app-network




  spring-compiler:
    build:
      context: ./spring-server
      dockerfile: Dockerfile.dev
    container_name: sign-language-spring-compiler
    volumes:
      - ./spring-server:/app
    working_dir: /app

  spring-server:
    image: tomcat:9.0-jdk17
    container_name: sign-language-spring
    ports:
      - "8080:8080"
    depends_on:
      - python-server
      - spring-compiler
    environment:
      - JAVA_OPTS=-Dpython.server.url=http://python-server:8000
    volumes:

      - ./spring-server/src/main/webapp:/usr/local/tomcat/webapps/ROOT

      - ./spring-server/target/classes:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes
      - ./spring-server/target/dependency:/usr/local/tomcat/webapps/ROOT/WEB-INF/lib
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
