<div class="auth-wrap">
  <div class="auth-box">
    <h2>회원가입</h2>

    <form>
      <div class="form-group">
        <label class="form-label" for="name">이름</label>
        <input type="text" id="name" class="form-input" placeholder="이름을 입력하세요" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input type="email" id="email" class="form-input" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input type="password" id="password" class="form-input" placeholder="8자 이상 입력하세요" autocomplete="new-password">
        <div class="form-hint">영문, 숫자 포함 8자 이상</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password2">비밀번호 확인</label>
        <input type="password" id="password2" class="form-input" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label">장애인 여부</label>
        <div class="disability-check">
          <input type="checkbox" id="isDeaf">
          <label for="isDeaf">
            청각장애인입니다
            <span>체크 시 접근성 최적화 UI가 적용됩니다.</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">회원가입 완료</button>
    </form>

    <div class="auth-footer">
      이미 계정이 있으신가요? <a href="auth_login.html">로그인</a>
    </div>
  </div>
</div>
