<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignBridge - 수어 디펜스</title>
<link rel="stylesheet" href="shared.css">
<style>
.game-shell {
  display: grid;
  grid-template-columns: 1fr 260px;
  gap: 0;
  border: 1.5px solid var(--border-strong);
}

/* 메인 게임 영역 */
.defense-main {
  background: #0d1f17;
  display: flex; flex-direction: column;
}
.status-bar {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid #1a3828;
  background: #0a160f;
}
.status-cell {
  flex: 1; padding: 14px 22px; text-align: center;
  border-right: 1px solid #1a3828;
}
.status-cell:last-child { border-right: none; }
.status-num { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
.status-lbl { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,.3); margin-top: 2px; }
.pause-btn {
  padding: 0 22px; background: rgba(255,255,255,.05); color: rgba(255,255,255,.5);
  border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700;
  border-left: 1px solid #1a3828; height: 100%;
}

.arena {
  flex: 1; position: relative; overflow: hidden; min-height: 360px;
}
.arena-guide {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,.08); font-size: 11px; font-weight: 900;
  letter-spacing: 3px; text-transform: uppercase; text-align: center;
}

.falling-word {
  position: absolute; padding: 8px 18px;
  background: rgba(45,155,111,.15); border: 1.5px solid rgba(45,155,111,.3);
  color: rgba(255,255,255,.85);
  font-size: 17px; font-weight: 800; white-space: nowrap;
  animation: fall linear forwards;
}
.falling-word.targeted {
  background: rgba(45,155,111,.4); border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 12px rgba(45,155,111,.4);
}
@keyframes fall { from{transform:translateY(-60px)} to{transform:translateY(400px)} }

.ground-line {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--danger);
}
.ground-line::before {
  content: 'DANGER ZONE';
  position: absolute; right: 8px; bottom: 4px;
  font-size: 9px; font-weight: 900; letter-spacing: 2px; color: rgba(192,57,43,.5);
}

/* 카메라 하단 영역 */
.cam-zone {
  display: flex; gap: 0;
  border-top: 1px solid #1a3828;
  background: #0a160f;
}
.cam-preview {
  width: 200px; min-height: 140px; flex-shrink: 0;
  background: #111c17;
  display: flex; align-items: center; justify-content: center;
  border-right: 1px solid #1a3828;
  font-size: 48px; opacity: .2;
}
.cam-info { flex: 1; padding: 16px 20px; }
.recog-lbl { font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 8px; }
.recog-word { font-size: 32px; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
.accuracy-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.acc-bar { flex: 1; height: 3px; background: #1a3828; }
.acc-fill { height: 100%; background: var(--accent); width: 91%; }
.acc-pct { font-size: 12px; font-weight: 800; color: var(--accent); }
.cam-btn {
  padding: 0 22px; background: var(--primary); color: #fff;
  border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 800;
  border-left: 1px solid #1a3828;
}

/* 사이드바 */
.game-sidebar {
  background: var(--surface);
  border-left: 1.5px solid var(--border-strong);
  display: flex; flex-direction: column;
}
.sidebar-section {
  padding: 18px 18px;
  border-bottom: 1.5px solid var(--border);
}
.sidebar-section h4 {
  font-size: 10px; font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px;
}
.life-row { display: flex; gap: 6px; align-items: center; }
.life-icon { font-size: 22px; }
.life-icon.lost { opacity: .2; filter: grayscale(1); }

.score-big { font-size: 42px; font-weight: 900; color: var(--primary); letter-spacing: -2px; }
.score-sub { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-top: 2px; }

.next-list { display: flex; flex-direction: column; gap: 0; }
.next-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 700;
}
.next-item:last-child { border-bottom: none; }
.next-num {
  width: 20px; height: 20px; background: var(--surface2);
  font-size: 11px; font-weight: 900; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.next-speed { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text-muted); }

.sidebar-ctrl {
  margin-top: auto; padding: 16px; border-top: 1.5px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.sidebar-ctrl .btn { justify-content: center; font-size: 13px; }

@media(max-width:768px){
  .game-shell { grid-template-columns: 1fr; }
  .game-sidebar { border-left: none; border-top: 1.5px solid var(--border-strong); }
}
</style>
</head>
<body>

  <div class="logo">✋ SignBridge</div>
  <nav>
