<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignBridge - 로그인</title>
<link rel="stylesheet" href="shared.css">
<style>
.auth-wrap {
  min-height: calc(100vh - 66px);
  display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
}
.auth-box {
  width: 100%; max-width: 440px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 44px 40px;
  box-shadow: 0 4px 24px rgba(45,155,111,.08);
}
.auth-logo {
  text-align: center; margin-bottom: 32px;
}
.auth-logo .logo-text {
  font-size: 24px; font-weight: 900; color: var(--primary);
}
.auth-logo p {
  font-size: 15px; font-weight: 500; color: var(--text-sub); margin-top: 6px;
}
.auth-box h2 {
  font-size: 22px; font-weight: 900; margin-bottom: 28px;
  letter-spacing: -0.3px;
}
.btn-full { width: 100%; justify-content: center; padding: 14px; font-size: 16px; }
.auth-footer {
  text-align: center; margin-top: 24px;
  font-size: 14px; font-weight: 500; color: var(--text-sub);
}
.auth-footer a { color: var(--primary); font-weight: 700; }
.divider-text {
  display: flex; align-items: center; gap: 12px;
  margin: 24px 0;
  font-size: 13px; font-weight: 600; color: var(--text-sub);
}
.divider-text::before, .divider-text::after {
  content: ''; flex: 1; height: 1.5px; background: var(--border);
}
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
    <a href="learn_basic.html">학습</a>
    <a href="board_list.html">게시판</a>
    <a href="auth_register.html" class="btn btn-primary" style="padding:7px 16px; font-size:14px;">회원가입</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-text">✋ SignBridge</div>
      <p>수어 학습을 계속하려면 로그인하세요.</p>
    </div>

    <h2>로그인</h2>

    <form>
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input type="email" id="email" class="form-input" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">로그인</button>
    </form>

    <div class="auth-footer">
      아직 계정이 없으신가요? <a href="auth_register.html">회원가입</a>
    </div>
  </div>
</div>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>
</body>
</html>
