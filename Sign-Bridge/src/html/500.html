<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - SignBridge</title>
<link rel="stylesheet" href="shared.css">
<style>
.error-page {
  min-height: calc(100vh - 66px - 86px);
  display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
}
.error-inner { width: 100%; max-width: 500px; text-align: center; }

.error-num {
  font-size: 120px; font-weight: 900; line-height: 1;
  letter-spacing: -6px;
  background: linear-gradient(135deg, var(--danger) 0%, #e67e63 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  user-select: none;
}
.error-emoji { font-size: 48px; display: block; margin-bottom: 16px; }
.error-title {
  font-size: 22px; font-weight: 900;
  letter-spacing: -0.3px; margin-bottom: 14px;
}
.error-desc {
  font-size: 15px; color: var(--text-sub); font-weight: 500;
  line-height: 1.8; margin-bottom: 36px;
}
.error-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.error-tip {
  font-size: 13px; color: var(--text-sub); font-weight: 600;
  border-top: 2px solid var(--border); padding-top: 22px;
}
.error-tip a { color: var(--primary); font-weight: 700; }

.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface); border: 2px solid var(--border);
  border-radius: 100px; padding: 6px 16px;
  font-size: 12px; font-weight: 800;
  color: var(--text-sub); letter-spacing: 0.5px;
  font-family: 'SF Mono', Consolas, monospace;
  margin-bottom: 20px;
}
.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
  </nav>
</header>

<main>
  <div class="error-page">
    <div class="error-inner">
      <span class="error-emoji">⚠️</span>
      <div class="status-pill"><span class="dot"></span>500 INTERNAL SERVER ERROR</div>
      <div class="error-num">500</div>
      <div class="error-title">서버에서 문제가 발생했어요</div>
      <p class="error-desc">
        일시적인 오류예요. <strong>잠시 후 다시 시도</strong>해 주세요.<br>
        문제가 계속되면 오류 신고로 알려주시면 빠르게 확인할게요.
      </p>
      <div class="error-cta">
        <a href="javascript:location.reload()" class="btn btn-primary btn-lg">다시 시도</a>
        <a href="index.html" class="btn btn-ghost btn-lg">홈으로 가기</a>
      </div>
      <p class="error-tip">
        오류가 반복된다면 <a href="board_list.html">게시판 → 오류 신고</a>로 알려주세요.
      </p>
    </div>
  </div>
</main>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>
</body>
</html>
