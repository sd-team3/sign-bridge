<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignBridge - 자음/모음 지문자 학습</title>
<link rel="stylesheet" href="shared.css">
<style>
.page-header {
  background: linear-gradient(135deg, var(--primary-light), #f0faf5);
  border: 2px solid var(--border);
  border-radius: var(--radius); padding: 36px;
  margin-bottom: 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.page-header h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
.page-header p { font-size: 15px; font-weight: 500; color: var(--text-sub); margin-top: 8px; }

/* 자음/모음 탭 */
.jamo-tabs {
  display: flex; gap: 0; margin-bottom: 24px;
  border: 1.5px solid var(--border-strong);
  background: var(--surface2);
}
.jamo-tab {
  flex: 1; padding: 14px 20px; cursor: pointer; text-align: center;
  font-size: 16px; font-weight: 800; color: var(--text-muted);
  border-right: 1.5px solid var(--border);
  background: transparent; border-top: none; border-left: none; border-bottom: 3px solid transparent;
  font-family: inherit; transition: all .15s;
}
.jamo-tab:last-child { border-right: none; }
.jamo-tab.active { color: var(--primary); background: var(--surface); border-bottom-color: var(--primary); }
.jamo-tab:hover:not(.active) { color: var(--text); background: var(--surface); }

.jamo-section { display: none; }
.jamo-section.active { display: block; }

.result-count { font-size: 14px; font-weight: 700; color: var(--text-sub); margin-bottom: 16px; }

.jamo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 36px;
}
.jamo-card {
  background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 16px; text-align: center; cursor: pointer;
  transition: all .2s; display: block; position: relative;
}
.jamo-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(45,155,111,.12); }
.jamo-char {
  font-size: 46px; font-weight: 900; color: var(--text);
  margin-bottom: 10px; letter-spacing: -1px;
}
.jamo-card:hover .jamo-char { color: var(--primary); }
.jamo-name { font-size: 13px; font-weight: 700; color: var(--text-sub); }
.jamo-done-mark {
  position: absolute; top: 10px; right: 10px;
  font-size: 12px; color: var(--primary); font-weight: 900;
}

.section-sub-title {
  font-size: 14px; font-weight: 800; color: var(--text-muted);
  margin: 24px 0 14px; display: flex; align-items: center; gap: 8px;
  letter-spacing: 0.3px;
}
.section-sub-title::after { content: ''; flex: 1; height: 1.5px; background: var(--border); }

/* 상세 패널 (선택 시) */
.jamo-detail {
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  display: none;
  grid-template-columns: 220px 1fr 1fr;
  margin-bottom: 32px;
}
.jamo-detail.show { display: grid; }
.jd-panel { padding: 0; }
.jd-panel + .jd-panel { border-left: 1.5px solid var(--border-strong); }
.jd-header {
  padding: 14px 18px; border-bottom: 1.5px solid var(--border);
  background: var(--surface2); font-size: 11px; font-weight: 900;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted);
  display: flex; align-items: center; justify-content: space-between;
}
.jd-info { padding: 24px 20px; }
.jd-char-big { font-size: 64px; font-weight: 900; margin-bottom: 8px; }
.jd-tip { font-size: 13px; font-weight: 500; color: var(--text-sub); line-height: 1.7; margin-top: 14px; }
.jd-video, .jd-cam {
  min-height: 220px; background: #0d1f17;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: rgba(255,255,255,.5); font-size: 13px; font-weight: 600; cursor: pointer;
}
.jd-cam { background: #111c17; }
.jd-play-ring {
  width: 60px; height: 60px; border: 3px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center; position: relative;
}
.jd-play-triangle {
  width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent;
  border-left: 18px solid rgba(255,255,255,.8); margin-left: 3px;
}
.jd-close { cursor: pointer; font-size: 12px; color: var(--text-muted); font-weight: 700; }
.jd-close:hover { color: var(--danger); }

@media(max-width:900px){
  .jamo-detail { grid-template-columns: 1fr; }
  .jd-panel + .jd-panel { border-left: none; border-top: 1.5px solid var(--border-strong); }
}
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
    <a href="learn_basic.html" class="active">학습</a>
    <a href="play_chain.html">플레이존</a>
    <a href="board_list.html">게시판</a>
    <a href="mypage.html" class="btn btn-ghost btn-sm" style="margin-left:12px;">내 계정</a>
  </nav>
</header>

<main>
  <div class="container page-body">

    <div class="page-header">
      <div>
        <h1>🤟 자음 · 모음 지문자 학습</h1>
        <p>수어의 기본이 되는 지문자(指文字)를 하나씩 익혀보세요. 자음 14개, 모음 10개로 구성되어 있어요.</p>
      </div>
      <a href="learn_basic.html" class="btn btn-ghost">← 학습 홈</a>
    </div>

    <div class="jamo-tabs">
      <button class="jamo-tab active" data-target="consonant">자음 (14)</button>
      <button class="jamo-tab" data-target="vowel">모음 (10)</button>
    </div>

    <!-- 선택된 지문자 상세 -->
    <div class="jamo-detail" id="jamoDetail">
      <div class="jd-panel">
        <div class="jd-header"><span>지문자 정보</span><span class="jd-close" id="jdClose">✕ 닫기</span></div>
        <div class="jd-info">
          <div class="jd-char-big" id="jdChar">ㄱ</div>
          <div class="word-category" id="jdName">기역</div>
          <div class="jd-tip" id="jdTip">오른손 검지를 곧게 펴고 나머지 손가락은 접어 ㄱ자 모양을 만듭니다.</div>
        </div>
      </div>
      <div class="jd-panel">
        <div class="jd-header"><span>모범 동작 영상</span></div>
        <div class="jd-video">
          <div class="jd-play-ring"><div class="jd-play-triangle"></div></div>
          <div>클릭하여 재생</div>
        </div>
      </div>
      <div class="jd-panel">
        <div class="jd-header"><span>내 동작 인식</span></div>
        <div class="jd-cam">
          <div style="font-size:48px; opacity:.15;">✋</div>
          <div>카메라를 켜고 따라 해보세요</div>
        </div>
      </div>
    </div>

    <!-- 자음 섹션 -->
    <div class="jamo-section active" id="section-consonant">
      <div class="result-count">기본 자음 14개</div>
      <div class="jamo-grid" id="grid-consonant"></div>
    </div>

    <!-- 모음 섹션 -->
    <div class="jamo-section" id="section-vowel">
      <div class="result-count">기본 모음 10개</div>
      <div class="jamo-grid" id="grid-vowel"></div>
    </div>

  </div>
</main>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>

<script>
const consonants = [
  {ch:'ㄱ', name:'기역', tip:'검지손가락을 곧게 펴고 나머지는 접어 ㄱ자 모양을 만듭니다.', done:true},
  {ch:'ㄴ', name:'니은', tip:'검지와 중지를 곧게 펴서 아래로 향하게 합니다.', done:true},
  {ch:'ㄷ', name:'디귿', tip:'손을 반쯤 접어 ㄷ자 형태의 각을 만듭니다.', done:false},
  {ch:'ㄹ', name:'리을', tip:'검지를 구부려 지그재그 형태를 표현합니다.', done:false},
  {ch:'ㅁ', name:'미음', tip:'양손 또는 한 손으로 네모 형태를 만듭니다.', done:false},
  {ch:'ㅂ', name:'비읍', tip:'네 손가락을 붙여 펴고 엄지를 접어 표현합니다.', done:false},
  {ch:'ㅅ', name:'시옷', tip:'검지와 중지를 교차하듯 세워 표현합니다.', done:false},
  {ch:'ㅇ', name:'이응', tip:'엄지와 검지를 둥글게 맞대어 원 모양을 만듭니다.', done:false},
  {ch:'ㅈ', name:'지읒', tip:'검지를 세우고 나머지 손가락을 접어 표현합니다.', done:false},
  {ch:'ㅊ', name:'치읓', tip:'ㅈ 모양에서 엄지를 살짝 세워 표현합니다.', done:false},
  {ch:'ㅋ', name:'키읔', tip:'ㄱ 모양에서 손가락을 하나 더 펴서 표현합니다.', done:false},
  {ch:'ㅌ', name:'티읕', tip:'ㄷ 모양에서 손가락을 살짝 벌려 표현합니다.', done:false},
  {ch:'ㅍ', name:'피읖', tip:'네 손가락을 모두 펴고 엄지를 벌려 표현합니다.', done:false},
  {ch:'ㅎ', name:'히읗', tip:'주먹을 쥔 상태에서 검지를 살짝 굽혀 표현합니다.', done:false},
];

const vowels = [
  {ch:'ㅏ', name:'아', tip:'손바닥을 펴서 오른쪽을 향하게 뻗습니다.', done:true},
  {ch:'ㅑ', name:'야', tip:'검지와 중지를 붙여 오른쪽으로 뻗습니다.', done:false},
  {ch:'ㅓ', name:'어', tip:'손바닥을 펴서 몸 쪽을 향하게 합니다.', done:false},
  {ch:'ㅕ', name:'여', tip:'검지와 중지를 붙여 몸 쪽으로 향하게 합니다.', done:false},
  {ch:'ㅗ', name:'오', tip:'손을 위로 향하게 하고 손가락을 모읍니다.', done:false},
  {ch:'ㅛ', name:'요', tip:'검지와 중지를 붙여 위쪽으로 향하게 합니다.', done:false},
  {ch:'ㅜ', name:'우', tip:'손을 아래로 향하게 하고 손가락을 모읍니다.', done:false},
  {ch:'ㅠ', name:'유', tip:'검지와 중지를 붙여 아래쪽으로 향하게 합니다.', done:false},
  {ch:'ㅡ', name:'으', tip:'손바닥을 펴서 수평으로 눕힙니다.', done:false},
  {ch:'ㅣ', name:'이', tip:'검지손가락을 세워 수직으로 표현합니다.', done:false},
];

function renderGrid(list, targetId) {
  const grid = document.getElementById(targetId);
  grid.innerHTML = list.map((item, idx) => `
    <div class="jamo-card" data-idx="${idx}" data-set="${targetId}">
      ${item.done ? '<span class="jamo-done-mark">✓</span>' : ''}
      <div class="jamo-char">${item.ch}</div>
      <div class="jamo-name">${item.name}</div>
    </div>
  `).join('');
}

renderGrid(consonants, 'grid-consonant');
renderGrid(vowels, 'grid-vowel');

// 탭 전환
const tabs = document.querySelectorAll('.jamo-tab');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.jamo-section').forEach(s => s.classList.remove('active'));
    document.getElementById('section-' + tab.dataset.target).classList.add('active');
    document.getElementById('jamoDetail').classList.remove('show');
  });
});

// 카드 클릭 -> 상세 표시
document.addEventListener('click', (e) => {
  const card = e.target.closest('.jamo-card');
  if (!card) return;
  const set = card.dataset.set === 'grid-consonant' ? consonants : vowels;
  const item = set[card.dataset.idx];
  document.getElementById('jdChar').textContent = item.ch;
  document.getElementById('jdName').textContent = item.name;
  document.getElementById('jdTip').textContent = item.tip;
  document.getElementById('jamoDetail').classList.add('show');
  document.getElementById('jamoDetail').scrollIntoView({behavior:'smooth', block:'center'});
});

document.getElementById('jdClose').addEventListener('click', () => {
  document.getElementById('jamoDetail').classList.remove('show');
});
</script>

</body>
</html>
