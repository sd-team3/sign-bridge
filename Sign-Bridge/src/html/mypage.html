<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignBridge - 마이페이지</title>
<link rel="stylesheet" href="shared.css">
<style>
.mypage-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  border: 1.5px solid var(--border-strong);
  align-items: stretch;
  min-height: 600px;
}
/* 왼쪽 프로필 사이드 */
.profile-side {
  background: var(--primary);
  color: #fff;
  display: flex; flex-direction: column;
  border-right: 1.5px solid var(--primary-dark);
}
.profile-top {
  padding: 32px 24px;
  border-bottom: 1px solid rgba(255,255,255,.15);
  text-align: center;
}
.avatar {
  width: 72px; height: 72px; border: 2px solid rgba(255,255,255,.4);
  margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; background: rgba(255,255,255,.1);
}
.profile-name { font-size: 18px; font-weight: 900; }
.profile-email { font-size: 12px; color: rgba(255,255,255,.65); margin-top: 3px; font-weight: 500; }
.tier-tag {
  display: inline-block; margin-top: 12px;
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.9);
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  padding: 4px 14px;
}

.profile-nav { flex: 1; padding: 8px 0; }
.profile-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 22px;
  font-size: 14px; font-weight: 700; color: rgba(255,255,255,.7);
  transition: all .12s;
  border-left: 3px solid transparent;
}
.profile-nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.profile-nav a.active { background: rgba(255,255,255,.12); color: #fff; border-left-color: #fff; }

/* 오른쪽 콘텐츠 */
.mypage-content { background: var(--bg); display: flex; flex-direction: column; }
.content-header {
  padding: 22px 28px;
  background: var(--surface);
  border-bottom: 1.5px solid var(--border);
  font-size: 11px; font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted);
}

.stats-strip {
  display: flex; gap: 0;
  background: var(--surface);
  border-bottom: 1.5px solid var(--border);
}
.stat-box {
  flex: 1; padding: 22px 24px; text-align: center;
  border-right: 1.5px solid var(--border);
}
.stat-box:last-child { border-right: none; }
.stat-num { font-size: 30px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
.stat-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.5px; }

.content-body { padding: 24px 28px; flex: 1; }
.prog-block { margin-bottom: 20px; }
.prog-block-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; font-weight: 700; margin-bottom: 8px;
}
.prog-track { height: 8px; background: var(--border); }
.prog-fill { height: 100%; background: var(--primary); }
.prog-fill.tier { background: linear-gradient(90deg, #f6d365, #fda085); }

.words-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.word-tag {
  padding: 5px 14px; background: var(--surface);
  border: 1.5px solid var(--border-strong);
  font-size: 14px; font-weight: 700; color: var(--text);
}

.section-sep {
  font-size: 10px; font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted);
  padding: 14px 0; margin: 18px 0 14px;
  border-top: 1.5px solid var(--border);
}

@media(max-width:768px){
  .mypage-layout { grid-template-columns: 1fr; }
  .profile-side { border-right: none; border-bottom: 1.5px solid var(--primary-dark); }
  .stats-strip { flex-wrap: wrap; }
  .stat-box { min-width: 50%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
    <a href="learn_basic.html">학습</a>
    <a href="play_chain.html">플레이존</a>
    <a href="board_list.html">게시판</a>
    <a href="mypage.html" class="active btn btn-ghost btn-sm" style="margin-left:12px;">내 계정</a>
  </nav>
</header>

<main>
  <div class="container page-body">
    <div class="mypage-layout">
      <div class="profile-side">
        <div class="profile-top">
          <div class="avatar">👤</div>
          <div class="profile-name">홍길동</div>
          <div class="profile-email">gildong@email.com</div>
          <div class="tier-tag">🥇 골드 티어</div>
        </div>
        <nav class="profile-nav">
          <a href="mypage.html" class="active">📊 학습 현황</a>
          <a href="mypage_history.html">📋 학습 기록</a>
          <a href="mypage_edit.html">⚙️ 회원정보 수정</a>
        </nav>
      </div>

      <div class="mypage-content">
        <div class="content-header">이번 달 학습 현황</div>
        <div class="stats-strip">
          <div class="stat-box"><div class="stat-num">42</div><div class="stat-lbl">학습한 단어</div></div>
          <div class="stat-box"><div class="stat-num">87%</div><div class="stat-lbl">평균 정확도</div></div>
          <div class="stat-box"><div class="stat-num">7일</div><div class="stat-lbl">연속 학습</div></div>
        </div>
        <div class="content-body">
          <div class="prog-block">
            <div class="prog-block-label"><span>기초 어휘 진행률</span><span style="color:var(--primary); font-weight:900;">68%</span></div>
            <div class="prog-track"><div class="prog-fill" style="width:68%"></div></div>
          </div>
          <div class="prog-block">
            <div class="prog-block-label"><span>비상 어휘 진행률</span><span style="color:var(--primary); font-weight:900;">35%</span></div>
            <div class="prog-track"><div class="prog-fill" style="width:35%"></div></div>
          </div>
          <div class="prog-block">
            <div class="prog-block-label"><span>다음 티어까지</span><span style="color:#d4840a; font-weight:900;">72%</span></div>
            <div class="prog-track"><div class="prog-fill tier" style="width:72%"></div></div>
          </div>

          <div class="section-sep">최근 학습 단어</div>
          <div class="words-cloud">
            <span class="word-tag">사과</span>
            <span class="word-tag">감사합니다</span>
            <span class="word-tag">병원</span>
            <span class="word-tag">도움</span>
            <span class="word-tag">화재</span>
            <span class="word-tag">경찰</span>
          </div>
          <div style="margin-top:20px;">
            <a href="mypage_history.html" class="btn btn-ghost btn-sm">전체 학습 기록 보기 →</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>
</body>
</html>
