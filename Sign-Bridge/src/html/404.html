<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - SignBridge</title>
<link rel="stylesheet" href="shared.css">
<style>
.error-page {
  min-height: calc(100vh - 66px - 86px);
  display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
}
.error-inner { width: 100%; max-width: 500px; text-align: center; }

.error-num {
  font-size: 120px; font-weight: 900; line-height: 1;
  letter-spacing: -6px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  user-select: none;
}
.error-emoji { font-size: 48px; display: block; margin-bottom: 16px; }
.error-title {
  font-size: 22px; font-weight: 900;
  letter-spacing: -0.3px; margin-bottom: 14px;
}
.error-desc {
  font-size: 15px; color: var(--text-sub); font-weight: 500;
  line-height: 1.8; margin-bottom: 36px;
}
.error-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.error-tip {
  font-size: 13px; color: var(--text-sub); font-weight: 600;
  border-top: 2px solid var(--border); padding-top: 22px;
}
.error-tip a { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
    <a href="learn_basic.html">학습</a>
    <a href="play_chain.html">플레이존</a>
    <a href="board_list.html">게시판</a>
    <a href="mypage.html" class="btn btn-ghost btn-sm">내 계정</a>
  </nav>
</header>

<main>
  <div class="error-page">
    <div class="error-inner">
      <span class="error-emoji">🤲</span>
      <div class="error-num">404</div>
      <div class="error-title">페이지를 찾을 수 없어요</div>
      <p class="error-desc">
        주소를 잘못 입력했거나, 삭제·이동된 페이지일 수 있어요.<br>
        URL을 다시 확인해 보세요.
      </p>
      <div class="error-cta">
        <a href="index.html" class="btn btn-primary btn-lg">홈으로 가기</a>
        <a href="learn_basic.html" class="btn btn-ghost btn-lg">학습 시작하기</a>
      </div>
      <p class="error-tip">
        찾으시는 단어가 있다면 <a href="learn_word.html">단어 사전</a>에서 검색해 보세요.
      </p>
    </div>
  </div>
</main>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>
</body>
</html>
