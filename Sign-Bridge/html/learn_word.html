<link rel="stylesheet" href="shared.css">
<style>
.search-bar {
  display: flex; gap: 10px; margin-bottom: 20px;
}
.search-input-wrap { flex: 1; position: relative; }
.search-input-wrap input {
  width: 100%; padding: 14px 18px 14px 48px;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 500; font-family: inherit;
  background: var(--surface); color: var(--text); transition: border-color .2s;
}
.search-input-wrap input:focus { outline: none; border-color: var(--primary); }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.filter-chip { padding: 8px 18px; border-radius: 100px; border: 2px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text-sub); transition: all .2s; }
.filter-chip.active, .filter-chip:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

.result-count { font-size: 14px; font-weight: 700; color: var(--text-sub); margin-bottom: 16px; }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.word-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 26px 20px; text-align: center; cursor: pointer; transition: all .22s; display: block; }
.word-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(45,155,111,.1); }
.word-emoji { font-size: 40px; margin-bottom: 12px; }
.word-text { font-size: 19px; font-weight: 900; margin-bottom: 5px; }
.word-sub { font-size: 13px; font-weight: 500; color: var(--text-sub); }
</style>
</head>
