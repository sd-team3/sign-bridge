<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignBridge - 회원가입</title>
<link rel="stylesheet" href="shared.css">
<style>
.auth-wrap {
  min-height: calc(100vh - 66px);
  display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
}
.auth-box {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 44px 40px;
  box-shadow: 0 4px 24px rgba(45,155,111,.08);
}
.auth-box h2 {
  font-size: 22px; font-weight: 900; margin-bottom: 28px;
  letter-spacing: -0.3px;
}
.btn-full { width: 100%; justify-content: center; padding: 14px; font-size: 16px; }
.auth-footer {
  text-align: center; margin-top: 24px;
  font-size: 14px; font-weight: 500; color: var(--text-sub);
}
.auth-footer a { color: var(--primary); font-weight: 700; }
.disability-check {
  background: var(--primary-light);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  display: flex; align-items: flex-start; gap: 12px;
}
.disability-check input[type="checkbox"] {
  width: 20px; height: 20px; accent-color: var(--primary);
  margin-top: 2px; flex-shrink: 0; cursor: pointer;
}
.disability-check label {
  font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; line-height: 1.5;
}
.disability-check label span {
  display: block; font-size: 13px; font-weight: 500; color: var(--text-sub); margin-top: 3px;
}
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
    <a href="learn_basic.html">학습</a>
    <a href="board_list.html">게시판</a>
    <a href="auth_login.html" class="btn btn-ghost" style="padding:7px 16px; font-size:14px;">로그인</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-box">
    <h2>회원가입</h2>

    <form>
      <div class="form-group">
        <label class="form-label" for="name">이름</label>
        <input type="text" id="name" class="form-input" placeholder="이름을 입력하세요" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input type="email" id="email" class="form-input" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input type="password" id="password" class="form-input" placeholder="8자 이상 입력하세요" autocomplete="new-password">
        <div class="form-hint">영문, 숫자 포함 8자 이상</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password2">비밀번호 확인</label>
        <input type="password" id="password2" class="form-input" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label">장애인 여부</label>
        <div class="disability-check">
          <input type="checkbox" id="isDeaf">
          <label for="isDeaf">
            청각장애인입니다
            <span>체크 시 접근성 최적화 UI가 적용됩니다.</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">회원가입 완료</button>
    </form>

    <div class="auth-footer">
      이미 계정이 있으신가요? <a href="auth_login.html">로그인</a>
    </div>
  </div>
</div>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>
</body>
</html>
