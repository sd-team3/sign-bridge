<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignBridge - 수어 시험 결과</title>
<link rel="stylesheet" href="shared.css">
<style>
.result-hero { text-align: center; padding: 52px 24px 36px; background: linear-gradient(160deg, #e2f5ec, #f0f7f4); border: 2px solid var(--border); border-radius: var(--radius); margin-bottom: 28px; }
.result-icon { font-size: 72px; margin-bottom: 16px; }
.result-verdict { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
.result-verdict.pass { color: var(--primary-dark); }
.result-verdict.fail { color: var(--danger); }
.result-sub { font-size: 16px; font-weight: 500; color: var(--text-sub); }
.result-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.result-stat { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 22px 16px; text-align: center; }
.result-stat .num { font-size: 30px; font-weight: 900; color: var(--primary); }
.result-stat .lbl { font-size: 13px; font-weight: 600; color: var(--text-sub); margin-top: 5px; }
.result-stat.danger .num { color: var(--danger); }
.result-stat.warn .num { color: var(--warn); }
.wrong-list-card { background: var(--surface); border: 2px solid rgba(192,57,43,.25); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }
.wrong-list-card h3 { font-size: 16px; font-weight: 800; color: var(--danger); margin-bottom: 18px; }
.wrong-table { width: 100%; border-collapse: collapse; }
.wrong-table th { font-size: 13px; font-weight: 700; color: var(--text-sub); text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); }
.wrong-table td { padding: 14px 12px; border-bottom: 1.5px solid var(--border); font-size: 15px; font-weight: 600; vertical-align: middle; }
.wrong-table tr:last-child td { border-bottom: none; }
.wrong-badge { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 100px; }
.wrong-badge.quiz { background: rgba(45,155,111,.12); color: var(--primary); }
.wrong-badge.cam { background: rgba(124,58,237,.1); color: #5b21b6; }
.retry-tag { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 100px; background: #fdf2f2; color: var(--danger); border: 1.5px solid rgba(192,57,43,.25); cursor: pointer; }
.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

@media(max-width: 700px) {
  .result-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav>
    <a href="index.html">홈</a>
    <a href="learn_basic.html">학습</a>
    <a href="play_chain.html">플레이존</a>
    <a href="board_list.html">게시판</a>
    <a href="mypage.html" class="btn btn-ghost" style="padding:7px 16px; font-size:14px;">내 계정</a>
  </nav>
</header>

<main>
  <div class="container page-body">

    <div class="result-hero">
      <div class="result-icon" id="r-icon">🎉</div>
      <div class="result-verdict pass" id="r-verdict">합격</div>
      <div class="result-sub" id="r-sub">기준 점수(70점)를 넘었어요. 잘 하셨습니다!</div>
    </div>

    <div class="result-stats">
      <div class="result-stat"><div class="num" id="r-score">82점</div><div class="lbl">최종 점수</div></div>
      <div class="result-stat"><div class="num" id="r-correct">8 / 10</div><div class="lbl">정답 수</div></div>
      <div class="result-stat warn"><div class="num" id="r-acc">91%</div><div class="lbl">평균 인식 정확도</div></div>
      <div class="result-stat danger"><div class="num" id="r-wrong">2</div><div class="lbl">틀린 문제</div></div>
    </div>

    <div class="wrong-list-card">
      <h3>⚠️ 틀린 단어 목록</h3>
      <table class="wrong-table">
        <thead>
          <tr>
            <th>#</th><th>단어</th><th>유형</th><th>카테고리</th><th>내 답 → 정답</th><th></th>
          </tr>
        </thead>
        <tbody id="wrong-tbody">
          <tr>
            <td style="color:var(--text-sub); font-size:14px;">3번</td>
            <td style="font-size:17px; font-weight:900;">🌍 지진</td>
            <td><span class="wrong-badge quiz">객관식</span></td>
            <td style="font-size:13px; color:var(--text-sub);">비상 어휘</td>
            <td style="font-size:14px;"><span style="color:var(--danger);">대피소</span> → <span style="color:var(--primary);">지진</span></td>
            <td><a href="learn_word_detail.html" class="retry-tag">다시 학습</a></td>
          </tr>
          <tr>
            <td style="color:var(--text-sub); font-size:14px;">7번</td>
            <td style="font-size:17px; font-weight:900;">🚒 소방서</td>
            <td><span class="wrong-badge cam">수어 인식</span></td>
            <td style="font-size:13px; color:var(--text-sub);">비상 어휘</td>
            <td style="font-size:14px;"><span style="color:var(--danger);">인식 실패</span> → <span style="color:var(--primary);">소방서</span></td>
            <td><a href="learn_word_detail.html" class="retry-tag">다시 학습</a></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="result-actions">
      <a href="exam_setup.html" class="btn btn-ghost btn-lg">⚙️ 다시 설정</a>
      <button class="btn btn-ghost btn-lg">📋 틀린 단어만 다시 풀기</button>
      <a href="exam_progress.html" class="btn btn-primary btn-lg">🔄 같은 설정으로 재시험</a>
    </div>

  </div>
</main>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>

</body>
</html>
