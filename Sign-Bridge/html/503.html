<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 - 점검 중 | SignBridge</title>
<link rel="stylesheet" href="shared.css">
<style>
.error-page {
  min-height: calc(100vh - 66px - 86px);
  display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
}
.error-inner { width: 100%; max-width: 500px; text-align: center; }

.error-num {
  font-size: 120px; font-weight: 900; line-height: 1;
  letter-spacing: -6px;
  background: linear-gradient(135deg, var(--warn) 0%, #f0c060 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  user-select: none;
}
.error-title {
  font-size: 22px; font-weight: 900;
  letter-spacing: -0.3px; margin-bottom: 14px;
}
.error-desc {
  font-size: 15px; color: var(--text-sub); font-weight: 500;
  line-height: 1.8; margin-bottom: 36px;
}
.error-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.error-tip {
  font-size: 13px; color: var(--text-sub); font-weight: 600;
  border-top: 2px solid var(--border); padding-top: 22px;
}
.error-tip a { color: var(--primary); font-weight: 700; }

/* 점검 정보 카드 */
.maintenance-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 32px;
  text-align: left;
}
.mc-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1.5px solid var(--border);
  font-size: 14px;
}
.mc-row:last-child { border-bottom: none; }
.mc-row .lbl { font-weight: 700; color: var(--text-sub); }
.mc-row .val { font-weight: 700; color: var(--text); }
.mc-row .val.ok { color: var(--primary); }

/* 스피너 */
.spinner-wrap { margin-bottom: 22px; }
.spinner {
  width: 52px; height: 52px; margin: 0 auto;
  border: 5px solid var(--border);
  border-top-color: var(--warn);
  border-radius: 50%;
  animation: spin 1.4s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">✋ SignBridge</div>
  <nav></nav>
</header>

<main>
  <div class="error-page">
    <div class="error-inner">
      <div class="spinner-wrap"><div class="spinner"></div></div>
      <div class="error-num">503</div>
      <div class="error-title">서비스 점검 중이에요</div>
      <p class="error-desc">
        더 나은 서비스를 위해 점검을 진행하고 있어요.<br>
        잠시만 기다려 주세요.
      </p>

      <div class="maintenance-card">
        <div class="mc-row">
          <span class="lbl">점검 시작</span>
          <span class="val">2025.06.30 02:00</span>
        </div>
        <div class="mc-row">
          <span class="lbl">예상 종료</span>
          <span class="val">2025.06.30 14:00</span>
        </div>
        <div class="mc-row">
          <span class="lbl">점검 내용</span>
          <span class="val">서버 업그레이드 및 DB 최적화</span>
        </div>
        <div class="mc-row">
          <span class="lbl">현재 상태</span>
          <span class="val ok">⏳ 진행 중</span>
        </div>
      </div>

      <div class="error-cta">
        <a href="javascript:location.reload()" class="btn btn-primary btn-lg">새로고침</a>
      </div>
      <p class="error-tip">
        문의사항은 <a href="mailto:support@signbridge.kr">support@signbridge.kr</a>로 보내주세요.
      </p>
    </div>
  </div>
</main>

<footer>© 2025 SignBridge. 청각장애인과 세상을 잇는 다리.</footer>
</body>
</html>
